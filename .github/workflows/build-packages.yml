name: Build and test packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Regression and packaging tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import os; from scripts.package_release import validate_version; validate_version(os.environ["RELEASE_TAG"])'
      - name: Test release staging and checksums
        run: python3 -m unittest discover -s tests -p 'test_release_*.py' -v
      - name: Download pinned AngelScript SDK
        run: |
          curl --fail --silent --show-error --location --retry 3 https://www.angelcode.com/angelscript/sdk/files/angelscript_2.38.0.zip -o "$RUNNER_TEMP/angelscript.zip"
          echo 'b33b5dbcda10317ef67d628353d83246984ce6fcac102d4dc2aed121eba52e6f  '"$RUNNER_TEMP/angelscript.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/angelscript.zip" -d "$RUNNER_TEMP/angelscript"
      - name: Compile both production scripts and test thinking behavior
        run: python3 tests/run_tests.py --sdk "$RUNNER_TEMP/angelscript/sdk"

  build:
    name: Windows installers and manual ZIP
    needs: test
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: releases/build/requirements-build.txt
      - name: Install pinned Python packaging dependencies
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'potplayer-python-venv'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Creating isolated Python environment failed.' }
          & "$venv/Scripts/python.exe" -m pip install --disable-pip-version-check --requirement releases/build/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Installing pinned Python dependencies failed.' }
          "$venv/Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Record build tool versions
        shell: pwsh
        run: |
          python --version
          python -m PyInstaller --version
          dotnet --list-sdks
          & 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe' -latest -property installationVersion
          Get-Item 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' | Select-Object -ExpandProperty VersionInfo
      - name: Build every format from the current source
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { (Get-Content -LiteralPath ./VERSION -Raw).Trim() }
          ./scripts/build_release.ps1 -Version $version -OutputDir "$env:GITHUB_WORKSPACE/dist"
      - name: Verify executable product and version metadata
        shell: pwsh
        run: |
          $info = Get-Content ./dist/BUILD-INFO.json -Raw | ConvertFrom-Json
          foreach ($name in @('installer.exe', 'installer-cpp.exe', 'installer-python.exe', 'installer-inno.exe')) {
            $metadata = (Get-Item (Join-Path ./dist $name)).VersionInfo
            if ($metadata.ProductName.TrimEnd(' ') -ne 'PotPlayer ChatGPT Translate') { throw "Unexpected product name in ${name}: [$($metadata.ProductName)]" }
            if ($metadata.ProductVersion.TrimEnd(' ') -ne $info.version) { throw "Unexpected product version in ${name}: [$($metadata.ProductVersion)] expected [$($info.version)]" }
          }
      - name: Test MSI install, repair, uninstall and file ownership
        shell: pwsh
        run: ./tests/test_msi_lifecycle.ps1 -MsiPath ./dist/installer.msi -BuildInfoPath ./dist/BUILD-INFO.json
      - name: Test untrusted signature verification and tamper rejection
        shell: pwsh
        run: ./tests/test_signing_integrity.ps1 -UnsignedDirectory ./dist
      # Test real GitHub raw-PE transport on PRs without any SignPath credential.
      - name: Prepare raw artifact transport fixture
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'raw-transport-input'
          New-Item -ItemType Directory -Path $directory | Out-Null
          Copy-Item -LiteralPath ./dist/installer-cpp.exe -Destination (Join-Path $directory 'native-transport-fixture.exe')
      - name: Upload raw PE transport fixture
        if: github.event_name == 'pull_request'
        id: raw_fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/raw-transport-input/native-transport-fixture.exe
          archive: false
          if-no-files-found: error
          retention-days: 1
      - name: Download raw PE without decompression
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.raw_fixture.outputs.artifact-id }}
          path: ${{ runner.temp }}/raw-transport-output
          skip-decompress: true
          digest-mismatch: error
      - name: Verify raw artifact is the original PE, not a ZIP
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          UPLOAD_DIGEST: ${{ steps.raw_fixture.outputs.artifact-digest }}
        run: |
          $files = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'raw-transport-output') -Force)
          if ($files.Count -ne 1 -or $files[0].Name -cne 'native-transport-fixture.exe' -or $files[0].PSIsContainer) { throw 'Unexpected raw artifact layout.' }
          $expected = (Get-FileHash -LiteralPath ./dist/installer-cpp.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected -or $env:UPLOAD_DIGEST -ne $expected) { throw 'Raw artifact bytes or upload digest changed.' }
          $bytes = [System.IO.File]::ReadAllBytes($files[0].FullName)
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw 'Expected raw PE bytes, not an archive.' }
          Write-Host 'PASS raw PE upload/download without decompression and exact SHA256 match'
      - name: Upload MSI diagnostic logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msi-diagnostic-logs-${{ github.sha }}
          path: ${{ runner.temp }}/potplayer-msi-test-logs/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
